<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kodenix Verify OTP - Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0c1218; }
    header { padding: 16px 24px; background: #101820; color: #F8FAFC; font-family: system-ui, sans-serif; border-bottom:1px solid #2a3742; }
    header h1 { margin: 0 0 8px; font-size: 20px; }
    header p { margin: 0 0 12px; color: #CBD5E1; }
    select { padding:8px 10px; border:1px solid #3a4a56; border-radius:5px; min-width:320px; background:#131c24; color:#edf2f5; }
    .theme-toggle { position:fixed; top:16px; right:18px; z-index:20; border:1px solid #33434f; border-radius:5px; background:#131c24; color:#dce5ea; padding:8px 12px; font:600 12px/1.2 system-ui,sans-serif; cursor:pointer; }
    .swagger-ui,.swagger-ui .info .title,.swagger-ui .info p,.swagger-ui .info li,.swagger-ui .opblock-tag,.swagger-ui .opblock .opblock-summary-description,.swagger-ui .parameter__name,.swagger-ui table thead tr td,.swagger-ui table thead tr th { color:#dce5ea; }
    .swagger-ui .scheme-container,.swagger-ui section.models,.swagger-ui .model-box { background:#131c24; box-shadow:none; border-color:#2a3742; }
    .swagger-ui .opblock-tag { border-bottom-color:#2a3742; }
    html:not([data-theme="light"]) .swagger-ui,
    html:not([data-theme="light"]) .swagger-ui .info,
    html:not([data-theme="light"]) .swagger-ui .info p,
    html:not([data-theme="light"]) .swagger-ui .markdown p,
    html:not([data-theme="light"]) .swagger-ui .markdown li,
    html:not([data-theme="light"]) .swagger-ui .opblock-description-wrapper p,
    html:not([data-theme="light"]) .swagger-ui .opblock-external-docs-wrapper p,
    html:not([data-theme="light"]) .swagger-ui .opblock-title_normal p,
    html:not([data-theme="light"]) .swagger-ui .response-col_status,
    html:not([data-theme="light"]) .swagger-ui .response-col_links,
    html:not([data-theme="light"]) .swagger-ui .parameter__name,
    html:not([data-theme="light"]) .swagger-ui .parameter__type,
    html:not([data-theme="light"]) .swagger-ui .parameter__in,
    html:not([data-theme="light"]) .swagger-ui .model,
    html:not([data-theme="light"]) .swagger-ui section.models h4,
    html:not([data-theme="light"]) .swagger-ui section.models h4 span,
    html:not([data-theme="light"]) .swagger-ui .model-title,
    html:not([data-theme="light"]) .swagger-ui .model .property,
    html:not([data-theme="light"]) .swagger-ui .model .property.primitive,
    html:not([data-theme="light"]) .swagger-ui .prop-type,
    html:not([data-theme="light"]) .swagger-ui .prop-format,
    html:not([data-theme="light"]) .swagger-ui .tab li,
    html:not([data-theme="light"]) .swagger-ui label,
    html:not([data-theme="light"]) .swagger-ui table thead tr th,
    html:not([data-theme="light"]) .swagger-ui table tbody tr td { color:#e6edf1; }
    html:not([data-theme="light"]) .swagger-ui .opblock-summary-path,
    html:not([data-theme="light"]) .swagger-ui .opblock-summary-path__deprecated,
    html:not([data-theme="light"]) .swagger-ui .opblock-summary-description { color:#f1f5f7; }
    html:not([data-theme="light"]) .swagger-ui .model-toggle::after { filter:invert(1) brightness(1.8); }
    html:not([data-theme="light"]) .swagger-ui section.models,
    html:not([data-theme="light"]) .swagger-ui section.models .model-container,
    html:not([data-theme="light"]) .swagger-ui .model-box { background:#111a22; }
    html:not([data-theme="light"]) .swagger-ui .opblock-body,
    html:not([data-theme="light"]) .swagger-ui .responses-inner { color:#e6edf1; background:#111a22; }
    html:not([data-theme="light"]) .swagger-ui .opblock .opblock-body,
    html:not([data-theme="light"]) .swagger-ui .parameters-container,
    html:not([data-theme="light"]) .swagger-ui .responses-wrapper { background:#111a22; }
    html:not([data-theme="light"]) .swagger-ui .opblock .opblock-section-header {
      background:#1b2731;
      box-shadow:0 1px 0 #344552;
    }
    html:not([data-theme="light"]) .swagger-ui .opblock .opblock-section-header h4,
    html:not([data-theme="light"]) .swagger-ui .opblock .opblock-section-header label,
    html:not([data-theme="light"]) .swagger-ui .opblock .opblock-section-header .tab-header .tab-item.active h4 span::after,
    html:not([data-theme="light"]) .swagger-ui .responses-inner h4,
    html:not([data-theme="light"]) .swagger-ui .responses-inner h5,
    html:not([data-theme="light"]) .swagger-ui .response-col_description,
    html:not([data-theme="light"]) .swagger-ui .response-col_description .markdown p,
    html:not([data-theme="light"]) .swagger-ui .parameters-col_description,
    html:not([data-theme="light"]) .swagger-ui .parameters-col_description p { color:#edf2f5; }
    html:not([data-theme="light"]) .swagger-ui table tbody tr td { border-bottom-color:#2a3a46; }
    html:not([data-theme="light"]) .swagger-ui .highlight-code,
    html:not([data-theme="light"]) .swagger-ui .microlight,
    html:not([data-theme="light"]) .swagger-ui pre.microlight { background:#17212a !important; color:#f4f7f9 !important; }
    html:not([data-theme="light"]) .swagger-ui .btn {
      background:#17212a;
      border-color:#637481;
      color:#edf2f5;
    }
    html:not([data-theme="light"]) .swagger-ui .btn:hover { background:#22313d; }
    html:not([data-theme="light"]) .swagger-ui .response-control-media-type__accept-message { color:#7ee2a8; }
    html:not([data-theme="light"]) .swagger-ui .opblock-body select,
    html:not([data-theme="light"]) .swagger-ui .content-type-wrapper select {
      background:#17212a;
      border-color:#637481;
      color:#f4f7f9;
    }
    html:not([data-theme="light"]) .swagger-ui input,
    html:not([data-theme="light"]) .swagger-ui textarea { background:#f8fafc; color:#172431; }
    html[data-theme="light"] { color-scheme:light; }
    html[data-theme="light"] body { background:#f5f7fa; }
    html[data-theme="light"] header { background:#fff; color:#18324a; border-bottom-color:#dfe4ea; }
    html[data-theme="light"] header p { color:#52616e; }
    html[data-theme="light"] select { background:#fff; color:#172431; border-color:#ccd4dc; }
    html[data-theme="light"] .theme-toggle { background:#fff; color:#233846; border-color:#ccd4dc; }
    html[data-theme="light"] .swagger-ui,html[data-theme="light"] .swagger-ui .info .title,html[data-theme="light"] .swagger-ui .info p,html[data-theme="light"] .swagger-ui .info li,html[data-theme="light"] .swagger-ui .opblock-tag,html[data-theme="light"] .swagger-ui .opblock .opblock-summary-description,html[data-theme="light"] .swagger-ui .parameter__name,html[data-theme="light"] .swagger-ui table thead tr td,html[data-theme="light"] .swagger-ui table thead tr th { color:#172431; }
    html[data-theme="light"] .swagger-ui .scheme-container,html[data-theme="light"] .swagger-ui section.models,html[data-theme="light"] .swagger-ui .model-box { background:#fff; border-color:#dfe4ea; }
  </style>
</head>
<body>
  <header>
    <h1>Kodenix Verify OTP - Swagger UI</h1>
    <p>Selecciona el contrato OpenAPI que quieres visualizar.</p>
    <select id="spec-select">
      <option value="../openapi/admin-api.yaml">admin-api.yaml</option>
<option value="../openapi/analytics-api.yaml">analytics-api.yaml</option>
<option value="../openapi/licensing-api.yaml">licensing-api.yaml</option>
<option value="../openapi/otp-public-api.yaml">otp-public-api.yaml</option>
<option value="../openapi/provider-internal-api.yaml">provider-internal-api.yaml</option>
<option value="../openapi/webhooks-api.yaml">webhooks-api.yaml</option>
    </select>
  </header>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script src="../docs-html/assets/docs.js"></script>
  <script>
    let ui;
    function loadSpec(url) {
      ui = SwaggerUIBundle({
        url,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'BaseLayout'
      });
    }
    const select = document.getElementById('spec-select');
    select.addEventListener('change', (event) => loadSpec(event.target.value));
    loadSpec(select.value || '../openapi/admin-api.yaml');
  </script>
</body>
</html>
